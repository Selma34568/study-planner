spring.application.name=studyplanner
server.port=8080

# H2 development database
spring.datasource.url=jdbc:h2:mem:studyplannerdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.profiles.active=dev

# JWT Configuration - long secret for HS256
jwt.secret=studyplanner-super-secret-key-for-jwt-authentication-change-this-in-production-123456789
jwt.expiration=86400000

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html

# Logging
logging.level.root=INFO
logging.level.com.efeselma.studyplanner=DEBUG
